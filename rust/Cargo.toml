[package]
name = "orkidea-duckdb"
description = "The Orkidea Oracle ADBC driver, as a static library for the DuckDB extension"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "orkidea_duckdb"
crate-type = ["staticlib"]

[dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
oracle_adbc = { package = "orkidea-adbc", git = "https://github.com/Tnsor-Labs/orkidea-adbc", rev = "724e12841b3c7d740608e86ba4b43618e58c6fc7" }

# oracledb 26.0.0-beta.6 as the driver's own build uses it (see its
# Cargo.toml): row sinks (oracle/rust-oracledb#85), which the driver's
# columnar fetching reads with, and an OSON visitor, in files marked as
# modified. Remove once a release includes them.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "d4939fd3d0268af31784eb2c425d6610e9f9d725" }

[profile.release]
lto = "thin"
codegen-units = 1
