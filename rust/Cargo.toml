[package]
name = "orkidea-duckdb"
description = "The Orkidea Oracle ADBC driver, as a static library for the DuckDB extension"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "orkidea_duckdb"
crate-type = ["staticlib"]

[dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
oracle_adbc = { package = "orkidea-adbc", git = "https://github.com/Tnsor-Labs/orkidea-adbc", rev = "2ca6557367b5e23385f73c2c920bab8d87073fa2" }

# oracledb 26.0.0-beta.5 with the fix for oracle/rust-oracledb#80, as the
# driver's own build uses. Remove once a release includes the fix.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "6bdb5c5e13ac734f1b1c8361b64f1f055cd2d393" }

[profile.release]
lto = "thin"
codegen-units = 1
