[package]
name = "orkidea-duckdb"
description = "The Orkidea Oracle ADBC driver, as a static library for the DuckDB extension"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "orkidea_duckdb"
crate-type = ["staticlib"]

[dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
oracle_adbc = { package = "orkidea-adbc", git = "https://github.com/Tnsor-Labs/orkidea-adbc", tag = "v0.2.1" }

# oracledb 26.0.0-beta.5 with the fixes the driver's own build uses (see its
# Cargo.toml): oracle/rust-oracledb#80 and #83, in files marked as modified.
# Remove once a release includes them.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "e7848e52031839c547ec086be7541f8e62b1c637" }

[profile.release]
lto = "thin"
codegen-units = 1
