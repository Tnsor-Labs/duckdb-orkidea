[package]
name = "orkidea-duckdb"
description = "The Orkidea Oracle ADBC driver, as a static library for the DuckDB extension"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "orkidea_duckdb"
crate-type = ["staticlib"]

[dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
oracle_adbc = { package = "orkidea-adbc", git = "https://github.com/Tnsor-Labs/orkidea-adbc", tag = "v0.3.0" }

# oracledb 26.0.0-beta.5 as the driver's own build uses it (see its
# Cargo.toml): the fixes for oracle/rust-oracledb#80 and #83, and row sinks
# (#85), which the driver's columnar fetching reads with, in files marked as
# modified. Remove once a release includes them.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "0f147cd6232be5b8a631a1cbcff94b7e0882cc2e" }

[profile.release]
lto = "thin"
codegen-units = 1
